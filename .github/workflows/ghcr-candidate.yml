name: Build latest official OmniRoute + version-aware Cloud9 image candidate
on:
  push:
    branches: [main, 'fix/**']
  schedule:
    - cron: "47 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: cloud9-omniroute-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      version: ${{ steps.stable.outputs.version }}
      tag: ${{ steps.stable.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Public privacy, cleaned PNG icons, 4 lockfile SHA256 values
        run: python3 tests/privacy.py
      - name: Select official latest stable (never upstream dev branch)
        id: stable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh api repos/cheaper-inference/OmniRoute/releases/latest --jq .tag_name)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "OMNIROUTE_OFFICIAL_STABLE=$tag"
      - name: Clone and patch official stable without touching its Git history
        env:
          UPSTREAM_TAG: ${{ steps.stable.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$UPSTREAM_TAG" https://github.com/cheaper-inference/OmniRoute.git upstream
          cd upstream
          if git apply --check ../overlays/cleanroom-csp-forward.patch; then
            git apply ../overlays/cleanroom-csp-forward.patch
            echo CLOUD9_CLEANROOM_CSP_PATCH_APPLIED
          elif git apply --reverse --check ../overlays/cleanroom-csp-forward.patch; then
            echo CLOUD9_CLEANROOM_CSP_ALREADY_UPSTREAM
          else
            echo CLOUD9_CLEANROOM_CSP_UPSTREAM_CONFLICT; exit 1
          fi
          python3 ../overlays/apply-cloud9-source-compat.py .
          git diff --check
          test -f tests/unit/cloud9-source-overlay.test.ts
          echo OMNIROUTE_FOUR_OVERLAYS_VERSION_CHECK_PASS
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: upstream/package-lock.json
      - name: Official dependencies and targeted compatibility regression tests
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --import tsx/esm --import ./open-sse/utils/setupPolyfill.ts \
            --test --test-force-exit \
            tests/unit/cloud9-source-overlay.test.ts \
            tests/unit/cloud9-tunnel-supervisor-lease.test.ts \
            tests/unit/chatgpt-web-first-party-cleanroom.test.ts
          echo CLOUD9_OMNIROUTE_SOURCE_AND_CLEANROOM_UNIT_TESTS_PASS
  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce the same official release and overlay on clean build runner
        env:
          UPSTREAM_TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$UPSTREAM_TAG" https://github.com/cheaper-inference/OmniRoute.git upstream
          cd upstream
          if git apply --check ../overlays/cleanroom-csp-forward.patch; then
            git apply ../overlays/cleanroom-csp-forward.patch
          elif ! git apply --reverse --check ../overlays/cleanroom-csp-forward.patch; then
            echo CLOUD9_CLEANROOM_CSP_UPSTREAM_CONFLICT; exit 1
          fi
          python3 ../overlays/apply-cloud9-source-compat.py .
          git diff --check
      - uses: docker/setup-buildx-action@v3
      - name: Build exact patched upstream runner-web image
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          pull: true
          load: true
          push: false
          target: runner-web
          platforms: linux/amd64
          tags: local/cloud9-omniroute-base:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Package native image with generic Cloud9 branding assets
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-context mcpvendor=./upstream/open-sse/vendor/codex-chatgpt-web \
            --build-arg BASE_IMAGE=local/cloud9-omniroute-base:candidate \
            -f overlays/Dockerfile.cloud9-branding \
            -t local/cloud9-omniroute:validated .
          docker run --rm --entrypoint sh local/cloud9-omniroute:validated -lc '
            set -eu
            test -f /app/public/providers/cloud9-assets/cloud9-engine.png
            test -f /app/public/providers/cloud9-assets/cloud9-speaches.png
            node -p "require(\"/app/package.json\").version" | grep -E "^[0-9]+[.][0-9]+[.][0-9]+$"
            test -f /app/healthcheck.mjs
            test -s /app/dist/open-sse/vendor/codex-chatgpt-web/adapters/chatgpt-web/mcp-server.js
            node --input-type=module -e "import(\"/app/dist/open-sse/vendor/codex-chatgpt-web/adapters/chatgpt-web/mcp-server.js\").then(m => { if (typeof m.runChatGptMcpServer !== \"function\") process.exit(11); })"
            echo CHATGPT_WEB_CODEX_MCP_BUNDLE_PASS
            echo CLOUD9_BRANDED_OMNIROUTE_IMAGE_STATIC_TEST_PASS
          '
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable GHCR candidate only, no latest or production auto-deploy
        env:
          UPSTREAM_VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ref="ghcr.io/godsquantum/cloud9-omniroute:upstream-$UPSTREAM_VERSION-sha-${GITHUB_SHA:0:12}-run-$GITHUB_RUN_ID"
          docker tag local/cloud9-omniroute:validated "$ref"
          docker push "$ref"
          echo "Immutable image candidate: $ref" >> "$GITHUB_STEP_SUMMARY"
          echo "NO production switch or latest promotion without OAuth/provider/Cleanroom/image E2E" >> "$GITHUB_STEP_SUMMARY"
          echo CLOUD9_OMNIROUTE_IMMUTABLE_CANDIDATE_PUBLISHED
