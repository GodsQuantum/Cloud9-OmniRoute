name: Track OmniRoute stable releases (no auto deploy)
on:
  schedule:
    - cron: "35 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  latest-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check official stable release versus certified baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          baseline="$(python3 -c 'import json;print(json.load(open("upstream-lock.json"))["stable_tag"])')"
          latest="$(gh api repos/cheaper-inference/OmniRoute/releases/latest --jq '.tag_name')"
          test -n "$latest"
          if [ "$baseline" = "$latest" ]; then
            echo "OmniRoute $latest: no newer stable release"
            exit 0
          fi
          title="Review OmniRoute upstream $latest"
          if gh issue list --state open --limit 100 --json title --jq '.[].title' | grep -Fx "$title" >/dev/null; then
            echo "Existing review issue found"
            exit 0
          fi
          gh issue create --title "$title" --body "Stable OmniRoute changed from $baseline to $latest. Verify all four canonical SHA256 patches in Cloud9-local-Patches and certify Gemini, 1min.AI, Codex, Cleanroom/CSP, branding + health/API in CT700 before rebuilding. DO NOT auto deploy."
